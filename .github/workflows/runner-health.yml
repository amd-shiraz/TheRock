name: Runner Health

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: read
  contents: write
  issues: write
  checks: write

concurrency:
  group: runner-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil

      - name: Collect runner health + job stats
        env:
          GH_TOKEN: ${{ secrets.RUNNER_HEALTH_TOKEN || github.token }}
          GH_OWNER: ROCm
          GH_REPO: TheRock
          LOOKBACK_HOURS: "24"
          ISSUE_ON_DEGRADED: "true"
          PUBLISH_PAGES: "true"
        run: |
          python .github/runner_health/runner_health.py

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runner-health-audit
          path: .github/runner_health/out/
          if-no-files-found: error
          retention-days: 30

      - name: Setup Pages
        if: ${{ env.PUBLISH_PAGES == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ env.PUBLISH_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github/runner_health/site/

  deploy:
    needs: health
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
