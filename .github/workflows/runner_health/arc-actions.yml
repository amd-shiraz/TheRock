#!/usr/bin/env python3
"""
ARC Actions (Kubernetes) - Python implementation

This script is designed to be run from a GitHub Actions workflow (arc-actions.yml) and
executes safe, auditable operational actions for ARC-managed runners on Kubernetes.

Supported actions:
- dump-debug : Collect ARC + runner namespace status/events/logs into an artifact bundle
- restart    : Rollout restart Deployments/StatefulSets in ARC namespace (best-effort)
- scale      : Scale RunnerScaleSet or RunnerDeployment to desired replicas
- pause      : Same as scale with replicas=0

Outputs (audit bundle):
- .github/runner_health/out_arc_action/inputs.json
- .github/runner_health/out_arc_action/detect.json
- .github/runner_health/out_arc_action/plan.json
- .github/runner_health/out_arc_action/*.txt logs/status/events (dump-debug)
- .github/runner_health/out_arc_action/result.json (apply results)

Environment variables (expected):
- ACTION: dump-debug | restart | scale | pause
- ARC_NS: namespace for ARC controller/listener (e.g., arc-systems)
- RUNNERS_NS: namespace for runner resources/pods (e.g., arc-runners)
- RUNNER_NAME: runner resource name (RunnerScaleSet or RunnerDeployment) for scale/pause
- REPLICAS: integer replicas for scale (ignored for dump-debug/restart; pause forces 0)
- INCLUDE_LOGS: "true"/"false" for dump-debug
- DRY_RUN: "true"/"false"

Notes:
- RunnerScaleSet schema varies across ARC versions. This script attempts common patches:
    1) spec.replicas
    2) spec.minRunners/spec.maxRunners
  It records which patch (if any) succeeded.
- This script shells out to `kubectl` (no Kubernetes python client required).
"""

from __future__ import annotations

import json
import os
import shlex
import subprocess
import sys
from dataclasses import dataclass
from datetime import datetime, timezone
from pathlib import Path
from typing import Any, Dict, List, Optional, Tuple


OUT_DIR = Path(".github/runner_health/out_arc_action")


# ----------------------------
# Utilities
# ----------------------------
def iso_now() -> str:
    return datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")


def getenv(name: str, default: Optional[str] = None) -> str:
    v = os.getenv(name, default)
    if v is None:
        raise RuntimeError(f"Missing env var: {name}")
    return v


def bool_env(name: str, default: str = "false") -> bool:
    v = os.getenv(name, default).strip().lower()
    return v in ("1", "true", "yes", "y", "on")


def write_json(path: Path, obj: Any) -> None:
    path.parent.mkdir(parents=True, exist_ok=True)
    path.write_text(json.dumps(obj, indent=2, sort_keys=False), encoding="utf-8")


def write_text(path: Path, text: str) -> None:
    path.parent.mkdir(parents=True, exist_ok=True)
    path.write_text(text, encoding="utf-8")


@dataclass
class CmdResult:
    ok: bool
    returncode: int
    stdout: str
    stderr: str
    argv: List[str]


def run_cmd(argv: List[str], *, check: bool = False, timeout_s: int = 120) -> CmdResult:
    p = subprocess.run(
        argv,
        text=True,
        capture_output=True,
        timeout=timeout_s,
    )
    ok = p.returncode == 0
    if check and not ok:
        raise RuntimeError(f"Command failed ({p.returncode}): {shlex.join(argv)}\n{p.stderr}")
    return CmdResult(ok=ok, returncode=p.returncode, stdout=p.stdout, stderr=p.stderr, argv=argv)


def kubectl(args: List[str], *, check: bool = False, timeout_s: int = 120) -> CmdResult:
    return run_cmd(["kubectl", *args], check=check, timeout_s=timeout_s)


def safe_filename(s: str) -> str:
    return "".join(c if c.isalnum() or c in ("-", "_", ".") else "_" for c in s)


def ensure_int(s: str, name: str) -> int:
    try:
        return int(s)
    except Exception:
        raise RuntimeError(f"Invalid integer for {name}: {s!r}")


# ----------------------------
# Detection
# ----------------------------
def detect_arc_crds() -> Dict[str, bool]:
    """
    Detect whether RunnerScaleSet (new ARC) and/or RunnerDeployment (legacy) CRDs exist.
    """
    has_rss = kubectl(["get", "crd", "runnerscalesets.actions.github.com"]).ok
    has_rd = kubectl(["get", "crd", "runnerdeployments.actions.summerwind.dev"]).ok
    return {"has_runnerscalesets": has_rss, "has_runnerdeployments": has_rd}


# ----------------------------
# dump-debug
# ----------------------------
def dump_debug(arc_ns: str, runners_ns: str, include_logs: bool) -> Dict[str, Any]:
    OUT_DIR.mkdir(parents=True, exist_ok=True)

    outputs: Dict[str, Any] = {"files": [], "include_logs": include_logs}

    def capture_text(filename: str, res: CmdResult) -> None:
        path = OUT_DIR / filename
        write_text(path, res.stdout if res.stdout else "")
        # Also write stderr if non-empty
        if res.stderr:
            write_text(OUT_DIR / f"{filename}.stderr.txt", res.stderr)
            outputs["files"].append(str((OUT_DIR / f"{filename}.stderr.txt").as_posix()))
        outputs["files"].append(str(path.as_posix()))

    # ARC namespace
    capture_text("arc_all.txt", kubectl(["-n", arc_ns, "get", "all", "-o", "wide"]))
    capture_text("arc_pods.txt", kubectl(["-n", arc_ns, "get", "pods", "-o", "wide"]))
    capture_text("arc_events.txt", kubectl(["-n", arc_ns, "get", "events", "--sort-by=.lastTimestamp"]))

    # Runner namespace
    capture_text("runners_all.txt", kubectl(["-n", runners_ns, "get", "all", "-o", "wide"]))
    capture_text("runner_pods.txt", kubectl(["-n", runners_ns, "get", "pods", "-o", "wide"]))
    capture_text("runners_events.txt", kubectl(["-n", runners_ns, "get", "events", "--sort-by=.lastTimestamp"]))

    if include_logs:
        # ARC logs (all pods, all containers, tail)
        pods_arc = kubectl(["-n", arc_ns, "get", "pods", "-o", "name"])
        if pods_arc.ok and pods_arc.stdout.strip():
            for line in pods_arc.stdout.splitlines():
                pod = line.strip()
                if not pod:
                    continue
                fname = f"log_{safe_filename(arc_ns)}_{safe_filename(pod.split('/')[-1])}.txt"
                res = kubectl(["-n", arc_ns, "logs", pod, "--all-containers", "--tail=2000"])
                capture_text(fname, res)

        # Runner pod logs (tail only)
        pods_run = kubectl(["-n", runners_ns, "get", "pods", "-o", "name"])
        if pods_run.ok and pods_run.stdout.strip():
            for line in pods_run.stdout.splitlines():
                pod = line.strip()
                if not pod:
                    continue
                fname = f"log_{safe_filename(runners_ns)}_{safe_filename(pod.split('/')[-1])}.txt"
                res = kubectl(["-n", runners_ns, "logs", pod, "--all-containers", "--tail=2000"])
                capture_text(fname, res)

    return outputs


# ----------------------------
# restart
# ----------------------------
def rollout_restart_namespace(arc_ns: str, dry_run: bool) -> Dict[str, Any]:
    """
    Rollout restart all deployments/statefulsets in ARC namespace (best-effort).
    """
    plan: List[Dict[str, Any]] = []
    results: List[Dict[str, Any]] = []

    def list_resources(kind: str) -> List[str]:
        r = kubectl(["-n", arc_ns, "get", kind, "-o", "name"])
        if not r.ok or not r.stdout.strip():
            return []
        return [x.strip() for x in r.stdout.splitlines() if x.strip()]

    for kind in ("deploy", "sts"):
        for name in list_resources(kind):
            plan.append({"op": "rollout_restart", "namespace": arc_ns, "resource": name})
            if dry_run:
                continue
            rr = kubectl(["-n", arc_ns, "rollout", "restart", name])
            results.append(
                {
                    "resource": name,
                    "ok": rr.ok,
                    "returncode": rr.returncode,
                    "stdout": rr.stdout,
                    "stderr": rr.stderr,
                }
            )

    return {"plan": plan, "results": results, "dry_run": dry_run}


# ----------------------------
# scale / pause
# ----------------------------
def scale_runner_resource(
    runners_ns: str,
    runner_name: str,
    replicas: int,
    detect: Dict[str, bool],
    dry_run: bool,
) -> Dict[str, Any]:
    """
    Scale either RunnerScaleSet (new ARC) or RunnerDeployment (legacy).
    For RunnerScaleSet we attempt two patch strategies, recording success/failure.
    """
    if not runner_name:
        raise RuntimeError("RUNNER_NAME is required for scale/pause actions.")

    plan: List[Dict[str, Any]] = []
    results: List[Dict[str, Any]] = []

    has_rss = detect.get("has_runnerscalesets", False)
    has_rd = detect.get("has_runnerdeployments", False)

    if has_rss:
        # Attempt patch strategy 1: spec.replicas
        patch1 = {"spec": {"replicas": replicas}}
        plan.append(
            {
                "op": "patch",
                "kind": "RunnerScaleSet",
                "namespace": runners_ns,
                "name": runner_name,
                "strategy": "spec.replicas",
                "patch": patch1,
            }
        )

        # Attempt patch strategy 2: spec.minRunners/spec.maxRunners
        patch2 = {"spec": {"minRunners": replicas, "maxRunners": replicas}}
        plan.append(
            {
                "op": "patch",
                "kind": "RunnerScaleSet",
                "namespace": runners_ns,
                "name": runner_name,
                "strategy": "spec.minRunners/spec.maxRunners",
                "patch": patch2,
            }
        )

        if dry_run:
            return {"plan": plan, "results": results, "dry_run": True}

        # Apply patch1 then patch2 if needed (best-effort)
        # We treat "ok" as a successful kubectl patch call, but we also store stderr for schema mismatch.
        p1 = kubectl(
            [
                "-n",
                runners_ns,
                "patch",
                "runnerscaleset",
                runner_name,
                "--type",
                "merge",
                "-p",
                json.dumps(patch1),
            ]
        )
        results.append(
            {
                "strategy": "spec.replicas",
                "ok": p1.ok,
                "returncode": p1.returncode,
                "stdout": p1.stdout,
                "stderr": p1.stderr,
            }
        )

        # If patch1 failed, try patch2
        if not p1.ok:
            p2 = kubectl(
                [
                    "-n",
                    runners_ns,
                    "patch",
                    "runnerscaleset",
                    runner_name,
                    "--type",
                    "merge",
                    "-p",
                    json.dumps(patch2),
                ]
            )
            results.append(
                {
                    "strategy": "spec.minRunners/spec.maxRunners",
                    "ok": p2.ok,
                    "returncode": p2.returncode,
                    "stdout": p2.stdout,
                    "stderr": p2.stderr,
                }
            )

        return {"plan": plan, "results": results, "dry_run": False}

    if has_rd:
        # Legacy RunnerDeployment supports kubectl scale
        plan.append(
            {
                "op": "scale",
                "kind": "RunnerDeployment",
                "namespace": runners_ns,
                "name": runner_name,
                "replicas": replicas,
            }
        )

        if dry_run:
            return {"plan": plan, "results": results, "dry_run": True}

        r = kubectl(["-n", runners_ns, "scale", "runnerdeployment", runner_name, f"--replicas={replicas}"])
        results.append(
            {"ok": r.ok, "returncode": r.returncode, "stdout": r.stdout, "stderr": r.stderr}
        )
        return {"plan": plan, "results": results, "dry_run": False}

    raise RuntimeError("No supported ARC CRDs detected (RunnerScaleSet or RunnerDeployment).")


# ----------------------------
# Main
# ----------------------------
def main() -> int:
    action = getenv("ACTION").strip().lower()
    arc_ns = getenv("ARC_NS", "arc-systems")
    runners_ns = getenv("RUNNERS_NS", "arc-runners")
    runner_name = getenv("RUNNER_NAME", "").strip()
    replicas_s = getenv("REPLICAS", "0").strip()
    include_logs = bool_env("INCLUDE_LOGS", "true")
    dry_run = bool_env("DRY_RUN", "true")

    # Ensure output directory
    OUT_DIR.mkdir(parents=True, exist_ok=True)

    inputs = {
        "timestamp": iso_now(),
        "action": action,
        "arc_namespace": arc_ns,
        "runners_namespace": runners_ns,
        "runner_resource_name": runner_name,
        "replicas": replicas_s,
        "include_logs": include_logs,
        "dry_run": dry_run,
    }
    write_json(OUT_DIR / "inputs.json", inputs)

    # Detect CRDs
    detect = detect_arc_crds()
    write_json(OUT_DIR / "detect.json", detect)

    # Record plan/result
    plan_out: Dict[str, Any] = {}
    result_out: Dict[str, Any] = {"timestamp": iso_now(), "action": action}

    if action == "dump-debug":
        plan_out = {
            "op": "dump-debug",
            "arc_namespace": arc_ns,
            "runners_namespace": runners_ns,
            "include_logs": include_logs,
            "dry_run_ignored": True,  # dump-debug is read-only
        }
        write_json(OUT_DIR / "plan.json", plan_out)
        result_out["dump_debug"] = dump_debug(arc_ns, runners_ns, include_logs)
        write_json(OUT_DIR / "result.json", result_out)
        return 0

    if action == "restart":
        plan_out = {"op": "restart", "arc_namespace": arc_ns}
        write_json(OUT_DIR / "plan.json", plan_out)
        result_out["restart"] = rollout_restart_namespace(arc_ns, dry_run=dry_run)
        write_json(OUT_DIR / "result.json", result_out)
        return 0

    if action in ("scale", "pause"):
        replicas = 0 if action == "pause" else ensure_int(replicas_s, "REPLICAS")
        plan_out = {
            "op": action,
            "runners_namespace": runners_ns,
            "runner_resource_name": runner_name,
            "replicas": replicas,
        }
        write_json(OUT_DIR / "plan.json", plan_out)
        result_out["scale"] = scale_runner_resource(
            runners_ns=runners_ns,
            runner_name=runner_name,
            replicas=replicas,
            detect=detect,
            dry_run=dry_run,
        )
        write_json(OUT_DIR / "result.json", result_out)
        return 0

    raise RuntimeError(f"Unknown ACTION: {action!r}")


if __name__ == "__main__":
    try:
        raise SystemExit(main())
    except Exception as e:
        # Write a structured error so the artifact shows what happened
        OUT_DIR.mkdir(parents=True, exist_ok=True)
        err = {"timestamp": iso_now(), "error": str(e), "type": type(e).__name__}
        write_json(OUT_DIR / "error.json", err)
        print(f"ERROR: {e}", file=sys.stderr)
        raise

